<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇠부리토크 가입 확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
         background: #f5f6f8; color: #1a1a1a; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 40px 32px; width: 100%; max-width: 420px;
          box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p.desc { font-size: 14px; color: #666; margin-bottom: 24px; }
  input { width: 100%; padding: 14px 16px; font-size: 18px; border: 1.5px solid #d9dce1; border-radius: 8px; }
  input:focus { outline: none; border-color: #2563eb; }
  button { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; font-weight: 600;
           background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .result { margin-top: 24px; padding: 20px; border-radius: 8px; font-size: 15px; line-height: 1.7; display: none; }
  .result.ok { display: block; background: #ecfdf5; border: 1px solid #a7f3d0; }
  .result.no { display: block; background: #fef2f2; border: 1px solid #fecaca; }
  .result.err { display: block; background: #fffbeb; border: 1px solid #fde68a; }
  .account { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; }
  .btn-inline { display: inline-block; margin-top: 12px; padding: 10px 18px; background: #dc2626; color: #fff;
                border-radius: 6px; text-decoration: none; font-weight: 600; }
  .btn-inline:hover { background: #b91c1c; }
  .countdown { font-weight: 700; color: #dc2626; }
</style>
</head>
<body>
<div class="card">
  <h1>쇠부리토크 가입 확인</h1>
  <p class="desc">사번을 입력하면 쇠부리토크 가입 여부와 가입해야 할 사내메일을 확인할 수 있습니다.</p>
  <form id="form" autocomplete="off">
    <input id="sabun" type="text" inputmode="numeric" placeholder="사번 입력" autocomplete="off" autofocus>
    <button type="submit">확인</button>
  </form>
  <div id="result" class="result"></div>
</div>
<script>
// ── 설정 ─────────────────────────────────────────────
var SIGNUP_URL = "https://newtalk.hyundai-steel.com/sign-up/"; // 회원가입(사내메일 가입) 페이지
var REDIRECT_SECONDS = 5;                      // 미가입 시 리다이렉트 대기 시간(초)
// ─────────────────────────────────────────────────────

var CSV_URL = "members.csv?t=" + Date.now();
var resultEl = document.getElementById("result");
var formEl = document.getElementById("form");
var inputEl = document.getElementById("sabun");
var members = null;      // Map(사번 -> {status, email})
var redirectTimer = null;

function loadMembers() {
  return fetch(CSV_URL).then(function (res) {
    if (!res.ok) throw new Error("CSV 로드 실패 (" + res.status + ")");
    return res.text();
  }).then(function (text) {
    var map = new Map();
    text.split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var sep = line.indexOf("|") >= 0 ? "|" : ",";
      var cols = line.split(sep).map(function (s) { return s.trim(); });
      var sabun = cols[0];
      if (!sabun || sabun === "사번") return; // 헤더/빈 줄 스킵
      if (!map.has(sabun)) {
        // 3열(사번|상태|메일) 신규 형식 — 구형 2열(사번|계정)도 호환
        var status = cols.length >= 3 ? cols[1] : "joined";
        var email = cols.length >= 3 ? cols[2] : (cols[1] || "");
        map.set(sabun, { status: status, email: email });
      }
    });
    return map;
  });
}


function stopRedirect() {
  if (redirectTimer) { clearInterval(redirectTimer); redirectTimer = null; }
}

formEl.addEventListener("submit", function (e) {
  e.preventDefault();
  stopRedirect();
  var val = inputEl.value.trim().replace(/\s+/g, "");
  resultEl.className = "result";
  resultEl.innerHTML = "";

  if (!val) {
    resultEl.className = "result err";
    resultEl.textContent = "사번을 입력해 주세요.";
    inputEl.focus();
    return;
  }

  var p = members ? Promise.resolve(members) : loadMembers().then(function (m) { members = m; return m; });
  p.then(function (m) {
    if (m.has(val)) {
      var info = m.get(val);
      if (info.status === "joined") {
        // ── 가입자 ──
        resultEl.className = "result ok";
        resultEl.innerHTML =
          "✅ <strong>가입되어 있습니다.</strong><br>" +
          "사번: " + val + "<br>" +
          "가입 계정: <span class='account'>" + info.email + "</span>";
      } else {
        // ── 가입 필요(미가입) ──
        resultEl.className = "result no";
        resultEl.innerHTML =
          "❌ <strong>아직 가입되어 있지 않습니다.</strong> (사번: " + val + ")<br>" +
          "이 사번의 가입 대상 사내메일은 <span class='account'>" + info.email + "</span> 입니다.<br>" +
          "<strong>이 메일로 인증하여 가입</strong>해 주세요. (다른 메일로 가입하면 가입 처리되지 않습니다)<br>" +
          "<span class='countdown' id='cd'>" + REDIRECT_SECONDS + "</span>초 후 회원가입 페이지로 이동합니다.<br>" +
          "<a class='btn-inline' href='" + SIGNUP_URL + "'>지금 " + info.email + "(으)로 가입하기</a>";
        var left = REDIRECT_SECONDS;
        redirectTimer = setInterval(function () {
          left--;
          var cd = document.getElementById("cd");
          if (cd) cd.textContent = left;
          if (left <= 0) { stopRedirect(); window.location.href = SIGNUP_URL; }
        }, 1000);
      }
    } else {
      // ── 명단에 없는 사번 ──
      resultEl.className = "result err";
      resultEl.innerHTML =
        "⚠️ <strong>입력한 사번이 명단에 없습니다.</strong> (사번: " + val + ")<br>" +
        "사번을 다시 확인해 주세요. 계속 오류가 있으면 아래 담당자에게 문의해 주세요.<br>" +
        "<strong>컬처디자인팀 김태준 책임</strong> <span class='account'>031-510-2433</span>";
    }
  }).catch(function (err) {
    resultEl.className = "result err";
    resultEl.textContent = "명단을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요. (" + err.message + ")";
  });
});
</script>
</body>
</html>
